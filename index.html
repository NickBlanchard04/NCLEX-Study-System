    <title>Nurse Command</title>
    <script>
      // A cached Pages document can reference assets removed by a newer deployment.
      // Retry the document once with a fresh URL, preserving its route and query.
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!(target instanceof HTMLLinkElement) || target.rel !== 'stylesheet') return;
        var asset = new URL(target.href, window.location.href);
        if (asset.origin !== window.location.origin || !asset.pathname.includes('/assets/')) return;
        var url = new URL(window.location.href);
        if (url.searchParams.has('_asset_refresh')) return;
        url.searchParams.set('_asset_refresh', String(Date.now()));
        window.location.replace(url.href);
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
