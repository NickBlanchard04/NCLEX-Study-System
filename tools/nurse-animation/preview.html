<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse walking preview</title><link rel="icon" href="data:,">
<style>body{margin:24px;background:#ddd8cc;color:#24313b;font:16px system-ui}h1{font-size:24px}canvas{display:block;max-width:100%;height:auto}button{font:inherit;padding:10px 18px;margin-top:16px}</style>
<h1>Nurse walking preview</h1><p>The same four directions and 16 poses used in the live ward.</p>
<canvas width="800" height="290" aria-label="Four nurses walking in southeast, southwest, northwest and northeast directions"></canvas>
<button type="button">Pause animation</button>
<script type="module">
const root='/game-assets/hospital-prototype/',canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d')
const [atlas,pivots]=await Promise.all(['atlas','pivots'].map(key=>fetch(root+`rigged-nurse-${key}.json`).then(r=>r.json())))
const image=new Image();image.src=root+'rigged-nurse-sheet.png';await image.decode()
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now(),elapsed=0
const button=document.querySelector('button');button.textContent=paused?'Play animation':'Pause animation';button.onclick=()=>{paused=!paused;button.textContent=paused?'Play animation':'Pause animation'}
function draw(now){if(!paused)elapsed+=Math.min(now-last,100);last=now;ctx.clearRect(0,0,800,290)
for(const [i,direction] of ['se','sw','nw','ne'].entries()){
const name=direction+'-'+(paused?'idle-0':'walk-'+(Math.floor(elapsed/48)%16)),entry=atlas.frames[name],f=entry.frame,crop=entry.spriteSourceSize,pivot=pivots.frames[name]
const x=100+i*200,y=245;ctx.fillStyle='#adb0a3';ctx.beginPath();ctx.ellipse(x,y,21,7,0,0,Math.PI*2);ctx.fill()
ctx.drawImage(image,f.x,f.y,f.w,f.h,x-pivot.pivotX*entry.sourceSize.w+crop.x,y-pivot.pivotY*entry.sourceSize.h+crop.y,crop.w,crop.h)
ctx.fillStyle='#24313b';ctx.fillText(direction.toUpperCase(),x-10,280)
}requestAnimationFrame(draw)}requestAnimationFrame(draw)
</script></html>
