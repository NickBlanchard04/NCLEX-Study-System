<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003B66" />
    <title>Nurse Command Offline</title>
    <style>
      :root {
        color: #0f253d;
        background: #f6f8fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 82% 18%, rgba(42, 125, 225, 0.18), transparent 32%),
          linear-gradient(135deg, #ffffff 0%, #eef5ff 100%);
      }

      main {
        width: min(100%, 460px);
        border: 1px solid #e5edf5;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 37, 61, 0.12);
        padding: 28px;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #3388ef 0%, #2a7de1 100%);
        color: white;
        font-size: 32px;
        font-weight: 800;
      }

      p.kicker {
        margin: 22px 0 0;
        color: #2a7de1;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 0;
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.05;
      }

      p {
        margin: 14px 0 0;
        color: #64748b;
        line-height: 1.7;
      }

      a {
        margin-top: 22px;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border-radius: 14px;
        background: #2a7de1;
        color: white;
        padding: 0 18px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">+</div>
      <p class="kicker">Offline Mode</p>
      <h1>You can keep studying once the app reconnects.</h1>
      <p>
        Nurse Command is installed, but this page was not available in the offline cache yet.
        Reopen a saved section or reconnect to sync the latest study data.
      </p>
      <a href="/">Return to app</a>
    </main>
  </body>
</html>
