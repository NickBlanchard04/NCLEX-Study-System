<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nurse Command</title>
    <script>
      const pathSegmentsToKeep = window.location.hostname.endsWith('.github.io') ? 1 : 0
      const locationPath = window.location.pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/')
      const redirectPath = `${window.location.origin}${locationPath}/?redirect=${encodeURIComponent(
        window.location.pathname + window.location.search + window.location.hash,
      )}`
      window.location.replace(redirectPath)
    </script>
  </head>
  <body>
    Redirecting to Nurse Command...
  </body>
</html>
